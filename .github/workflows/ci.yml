name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            pyproject.toml

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked runtime dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Install project and dev tools
        run: python -m pip install -e .[dev]

      - name: Check dependency integrity
        run: python -m pip check

      - name: Lint
        run: ruff check src tests

      - name: Test with coverage
        run: python -m pytest

      - name: Type check
        run: mypy src/business_bridge tests
