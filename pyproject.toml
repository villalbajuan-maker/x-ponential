[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-bridge"
version = "0.5.0"
description = "Business Bridge pilot and repository scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.8",
  "uvicorn==0.39.0",
  "pydantic==2.13.4",
  "python-multipart==0.0.20",
  "requests==2.32.5",
  "PyMuPDF==1.26.5",
  "pytesseract==0.3.13",
  "Pillow==11.3.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-cov==7.1.0"]
dev = ["pytest==8.4.2", "pytest-cov==7.1.0", "ruff==0.15.21", "mypy==1.19.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=business_bridge --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90"

[tool.coverage.run]
source = ["business_bridge"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/business_bridge", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
